<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Loại Khóa học (Categories)</title>
    <!-- Bootstrap 5 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <!-- Navbar Fragment -->
    <div th:replace="~{layout/navbar :: navbar}"></div>

    <main class="container my-4">
        <!-- Flash Messages -->
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i>
            <span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- RÀNG BUỘC 1 (DEMO YÊU CẦU 13): Báo lỗi khi xóa loại khóa học đang được sử dụng -->
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <strong>Lỗi thao tác: </strong>
            <span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold mb-1">Quản lý Loại Khóa học</h2>
                <p class="text-muted mb-0">Thiết lập các danh mục chuyên ngành và kiểm tra ràng buộc toàn vẹn</p>
            </div>
            <div>
                <a th:href="@{/courses}" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left me-1"></i> Quay lại danh sách khóa học
                </a>
            </div>
        </div>

        <div class="row">
            <!-- Form thêm loại khóa học mới -->
            <div class="col-lg-4 mb-4">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-white py-3">
                        <h5 class="card-title mb-0 fw-semibold text-primary">
                            <i class="bi bi-plus-circle me-2"></i>Thêm loại khóa học
                        </h5>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/categories/create}" th:object="${newCategory}" method="post">
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Tên loại khóa học <span class="text-danger">*</span></label>
                                <input type="text" th:field="*{name}" class="form-control"
                                       th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''"
                                       placeholder="Ví dụ: Thiết kế Đồ họa & UI/UX">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">
                                    Tên loại khóa học không được để trống
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Mô tả tóm tắt</label>
                                <textarea th:field="*{description}" class="form-control" rows="3"
                                          placeholder="Nhập mô tả cho loại khóa học..."></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">
                                <i class="bi bi-check-lg me-1"></i> Lưu loại khóa học
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Bảng danh sách Loại khóa học -->
            <div class="col-lg-8 mb-4">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                        <h5 class="card-title mb-0 fw-semibold text-primary">
                            <i class="bi bi-list-stars me-2"></i>Danh sách hiện có (<span th:text="${categories.size()}"></span>)
                        </h5>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead>
                                    <tr>
                                        <th class="text-center" style="width: 60px;">ID</th>
                                        <th>Tên loại</th>
                                        <th>Mô tả</th>
                                        <th class="text-center">Số khóa học</th>
                                        <th class="text-end" style="width: 100px;">Thao tác</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="cat : ${categories}">
                                        <td class="text-center fw-semibold text-muted" th:text="${cat.id}">1</td>
                                        <td class="fw-bold" th:text="${cat.name}">Lập trình Web</td>
                                        <td class="text-muted small" th:text="${cat.description != null ? cat.description : '---'}">Mô tả</td>
                                        <td class="text-center">
                                            <span class="badge bg-primary-subtle text-primary border px-2 py-1"
                                                  th:text="${cat.courses.size()} + ' khóa học'">2 khóa học</span>
                                        </td>
                                        <td class="text-end">
                                            <!-- Nút xóa (Demo Yêu cầu 13: Xóa loại đang có khóa học sẽ bị chặn) -->
                                            <form th:action="@{/categories/{id}/delete(id=${cat.id})}" method="post"
                                                  onsubmit="return confirm('Bạn có chắc muốn xóa loại khóa học này không?');">
                                                <button type="submit" class="btn btn-outline-danger btn-sm" title="Xóa loại">
                                                    <i class="bi bi-trash"></i> Xóa
                                                </button>
                                            </form>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
