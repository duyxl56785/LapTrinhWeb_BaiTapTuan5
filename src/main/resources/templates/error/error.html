<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${errorTitle != null ? errorTitle : 'Thông báo lỗi hệ thống'}">Thông báo Lỗi</title>
    <!-- Bootstrap 5 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-6 text-center">
                <div class="card border-0 shadow-lg p-4 p-md-5">
                    <div class="mb-4">
                        <span class="display-1 fw-bold text-danger" th:text="${errorCode != null ? errorCode : '404'}">404</span>
                        <div class="mt-2">
                            <i class="bi bi-shield-exclamation text-warning" style="font-size: 3rem;"></i>
                        </div>
                    </div>

                    <h3 class="fw-bold mb-3" th:text="${errorTitle != null ? errorTitle : 'Không tìm thấy dữ liệu'}">
                        Thông báo xử lý
                    </h3>

                    <div class="alert alert-danger-subtle border border-danger-subtle text-danger py-3 px-4 mb-4 text-start">
                        <i class="bi bi-info-circle-fill me-2"></i>
                        <span th:text="${errorMessage != null ? errorMessage : 'Tài nguyên bạn đang cố truy cập không tồn tại hoặc đã bị xóa.'}">
                            Nội dung chi tiết lỗi.
                        </span>
                    </div>

                    <p class="text-muted mb-4">
                        Hệ thống đã bắt và xử lý an toàn ngoại lệ này theo cơ chế <strong>Global Exception Handler</strong>. Bạn có thể quay lại trang chủ một cách an toàn.
                    </p>

                    <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
                        <a th:href="${backUrl != null ? backUrl : '/courses'}" class="btn btn-primary px-4 py-2 shadow-sm">
                            <i class="bi bi-house-door me-1"></i> Về danh sách khóa học
                        </a>
                        <button onclick="window.history.back()" class="btn btn-outline-secondary px-4 py-2">
                            <i class="bi bi-arrow-left me-1"></i> Quay lại trang trước
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
