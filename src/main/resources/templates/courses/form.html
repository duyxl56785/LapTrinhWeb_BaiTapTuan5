<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${isEdit ? 'Chỉnh sửa Khóa học' : 'Thêm mới Khóa học'}">Thông tin Khóa học</title>
    <!-- Bootstrap 5 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <!-- Navbar Fragment -->
    <div th:replace="~{layout/navbar :: navbar}"></div>

    <main class="container my-4">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <!-- Nút quay lại -->
                <div class="mb-3">
                    <a th:href="@{/courses}" class="btn btn-outline-secondary btn-sm">
                        <i class="bi bi-arrow-left me-1"></i> Quay lại danh sách
                    </a>
                </div>

                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-white py-3">
                        <h4 class="card-title mb-0 fw-bold text-primary" th:text="${isEdit ? 'Chỉnh sửa Khóa học' : 'Thêm mới Khóa học'}">
                            Thông tin Khóa học
                        </h4>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="${isEdit ? '/courses/' + courseForm.id + '/edit' : '/courses/create'}"
                              th:object="${courseForm}" method="post">
                            
                            <input type="hidden" th:field="*{id}" />

                            <!-- 1. Tên khóa học -->
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Tên khóa học <span class="text-danger">*</span></label>
                                <input type="text" th:field="*{name}" class="form-control"
                                       th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''"
                                       placeholder="Ví dụ: Lập trình Java Spring Boot nâng cao">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">
                                    Tên khóa học không hợp lệ
                                </div>
                            </div>

                            <!-- 2. Loại khóa học (Lấy từ database) -->
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Loại khóa học (Category) <span class="text-danger">*</span></label>
                                <select th:field="*{categoryId}" class="form-select"
                                        th:classappend="${#fields.hasErrors('categoryId')} ? 'is-invalid' : ''">
                                    <option value="">-- Chọn loại khóa học --</option>
                                    <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
                                </select>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}">
                                    Vui lòng chọn loại khóa học
                                </div>
                            </div>

                            <div class="row">
                                <!-- 3. Học phí -->
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-semibold">Học phí (VNĐ) <span class="text-danger">*</span></label>
                                    <input type="number" step="10000" th:field="*{tuitionFee}" class="form-control"
                                           th:classappend="${#fields.hasErrors('tuitionFee')} ? 'is-invalid' : ''"
                                           placeholder="Ví dụ: 3500000">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('tuitionFee')}" th:errors="*{tuitionFee}">
                                        Học phí phải lớn hơn 0
                                    </div>
                                </div>

                                <!-- 4. Thời lượng -->
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-semibold">Thời lượng (giờ) <span class="text-danger">*</span></label>
                                    <input type="number" step="1" th:field="*{duration}" class="form-control"
                                           th:classappend="${#fields.hasErrors('duration')} ? 'is-invalid' : ''"
                                           placeholder="Ví dụ: 30">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('duration')}" th:errors="*{duration}">
                                        Thời lượng phải lớn hơn 0
                                    </div>
                                    <small class="text-muted">≤ 30h: Ngắn hạn | > 30h: Dài hạn</small>
                                </div>
                            </div>

                            <!-- 5. Trạng thái -->
                            <div class="mb-3">
                                <div class="form-check form-switch mt-2">
                                    <input class="form-check-input" type="checkbox" role="switch" th:field="*{isActive}" id="isActiveSwitch">
                                    <label class="form-check-label fw-semibold" for="isActiveSwitch">
                                        Đang mở tuyển sinh
                                    </label>
                                </div>
                                <small class="text-muted">Nếu tắt, khóa học sẽ ở trạng thái "Ngừng tuyển sinh".</small>
                            </div>

                            <!-- 6. Mô tả -->
                            <div class="mb-4">
                                <label class="form-label fw-semibold">Mô tả chi tiết khóa học</label>
                                <textarea th:field="*{description}" class="form-control" rows="4"
                                          placeholder="Nhập nội dung tóm tắt hoặc mục tiêu của khóa học..."></textarea>
                            </div>

                            <!-- Nút Lưu / Hủy -->
                            <div class="d-flex justify-content-end gap-2">
                                <a th:href="@{/courses}" class="btn btn-secondary px-4">Hủy bỏ</a>
                                <button type="submit" class="btn btn-primary px-4">
                                    <i class="bi bi-save me-1"></i> Lưu khóa học
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
