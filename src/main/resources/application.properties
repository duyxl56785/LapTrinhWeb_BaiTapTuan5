# ===================================================================
# CẤU HÌNH CƠ SỞ DỮ LIỆU (POSTGRESQL MẶC ĐỊNH)
# ===================================================================
spring.application.name=course-management
server.port=8088

# Cấu hình PostgreSQL (Đã tự động kết nối với course_db và mật khẩu của máy)
spring.datasource.url=jdbc:postgresql://localhost:5432/course_db
spring.datasource.username=postgres
spring.datasource.password=12345678
spring.datasource.driver-class-name=org.postgresql.Driver

# Cấu hình JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===================================================================
